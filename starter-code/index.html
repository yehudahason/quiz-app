<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Frontend Quiz (Mock)</title>
  <style>
    :root{
      --bg:#f5f7fb;
      --card:#ffffff;
      --text:#1f2a37;
      --muted:#6b7280;
      --shadow: 0 14px 40px rgba(16,24,40,.10);
      --border: rgba(31,42,55,.10);

      --purple:#8b35ff;
      --purple2:#a64cff;

      --green:#22c55e;
      --red:#ef4444;
      --pill:#f2f4f8;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background: #1a1a1a; /* frame like screenshot */
    }

    /* Outer frame */
    .app-frame{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:36px 18px;
    }
    .canvas{
      width:min(1100px, 100%);
      aspect-ratio: 16/9;
      background: var(--bg);
      border-radius: 16px;
      box-shadow: 0 30px 90px rgba(0,0,0,.35);
      position:relative;
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.06);
    }

    /* subtle blobs */
    .canvas::before,
    .canvas::after{
      content:"";
      position:absolute;
      inset:auto;
      width:900px;
      height:900px;
      border-radius:50%;
      background: radial-gradient(circle at 30% 30%, rgba(139,53,255,.10), rgba(139,53,255,0) 60%);
      pointer-events:none;
      filter: blur(0px);
    }
    .canvas::before{ left:-520px; top:-420px; }
    .canvas::after{
      right:-620px;
      bottom:-540px;
      background: radial-gradient(circle at 40% 40%, rgba(139,53,255,.10), rgba(139,53,255,0) 60%);
    }

    /* Top-right theme controls */
    .top-controls{
      position:absolute;
      top:26px;
      right:30px;
      display:flex;
      align-items:center;
      gap:14px;
      z-index:5;
      opacity:.95;
    }
    .icon{
      width:20px; height:20px;
      display:grid; place-items:center;
      color: rgba(31,42,55,.55);
    }
    .switch{
      width:42px; height:22px;
      border-radius:999px;
      background: rgba(139,53,255,.22);
      border:1px solid rgba(139,53,255,.30);
      position:relative;
    }
    .switch::after{
      content:"";
      width:18px; height:18px;
      border-radius:50%;
      position:absolute;
      top:1px; left:21px;
      background: var(--purple);
      box-shadow: 0 6px 16px rgba(139,53,255,.35);
    }

    /* Screen container */
    .screen{
      position:absolute;
      inset:0;
      padding:56px 68px;
      display:none;
    }
    .screen.active{ display:block; }

    /* Header label (Accessibility + icon) */
    .topic{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:22px;
      font-weight:700;
      color:rgba(31,42,55,.85);
    }
    .topic .badge{
      width:40px; height:40px;
      border-radius:12px;
      background: rgba(139,53,255,.10);
      border: 1px solid rgba(139,53,255,.16);
      display:grid; place-items:center;
      color: var(--purple);
    }

    /* Two-column layout */
    .grid{
      height:calc(100% - 70px);
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap:60px;
      align-items:center;
    }

    /* Left copy */
    .kicker{
      color: rgba(107,114,128,.9);
      font-style: italic;
      font-size:14px;
      margin: 4px 0 10px;
    }
    h1{
      margin: 0 0 16px;
      font-size:48px;
      line-height:1.04;
      letter-spacing:-.02em;
    }
    .sub{
      margin:0;
      color: rgba(107,114,128,.95);
      font-size:14px;
      font-style: italic;
    }

    /* Right menu cards */
    .menu{
      display:flex;
      flex-direction:column;
      gap:16px;
      max-width:520px;
      margin-left:auto;
    }
    .menu-card{
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(31,42,55,.08);
      box-shadow: 0 10px 30px rgba(16,24,40,.08);
      border-radius: 14px;
      padding:18px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }
    .menu-left{
      display:flex;
      align-items:center;
      gap:14px;
      font-weight:700;
      color: rgba(31,42,55,.9);
    }
    .menu-ico{
      width:36px; height:36px;
      border-radius:12px;
      background: var(--pill);
      display:grid; place-items:center;
      border: 1px solid rgba(31,42,55,.06);
      color: rgba(31,42,55,.75);
      font-size:14px;
      font-weight:800;
    }

    /* Question screen */
    .qwrap{
      display:grid;
      grid-template-columns: 1.05fr .95fr;
      gap:60px;
      align-items:center;
    }
    .qtitle{
      font-size:34px;
      line-height:1.15;
      margin:0 0 20px;
      font-weight:800;
      letter-spacing:-.01em;
    }
    .progress{
      margin-top:36px;
      width:340px;
      height:6px;
      border-radius:999px;
      background: rgba(31,42,55,.10);
      overflow:hidden;
    }
    .progress > div{
      width:58%;
      height:100%;
      background: linear-gradient(90deg, var(--purple), var(--purple2));
      border-radius:999px;
    }

    .answers{
      max-width:520px;
      margin-left:auto;
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    .ans{
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(31,42,55,.08);
      box-shadow: 0 10px 26px rgba(16,24,40,.07);
      border-radius: 14px;
      padding:16px 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }
    .ans-left{
      display:flex;
      align-items:center;
      gap:14px;
      font-weight:700;
    }
    .letter{
      width:36px; height:36px;
      border-radius:10px;
      display:grid; place-items:center;
      background: #eef1f7;
      border: 1px solid rgba(31,42,55,.06);
      color: rgba(31,42,55,.75);
      font-weight:900;
    }
    .value{
      font-size:18px;
      color: rgba(31,42,55,.86);
      letter-spacing:.01em;
    }
    .status{
      width:30px; height:30px;
      border-radius:999px;
      display:grid; place-items:center;
      border: 1px solid rgba(31,42,55,.10);
      color: rgba(31,42,55,.55);
      background: rgba(255,255,255,.7);
      font-weight:900;
    }

    /* Correct / wrong states like screenshot */
    .ans.correct .status{
      color: var(--green);
      border-color: rgba(34,197,94,.35);
      background: rgba(34,197,94,.08);
    }
    .ans.wrong{
      border: 2px solid rgba(239,68,68,.70);
      box-shadow: 0 16px 40px rgba(239,68,68,.12);
    }
    .ans.wrong .letter{
      background: rgba(239,68,68,.12);
      border-color: rgba(239,68,68,.35);
      color: var(--red);
    }
    .ans.wrong .status{
      color: var(--red);
      border-color: rgba(239,68,68,.35);
      background: rgba(239,68,68,.08);
    }

    .cta{
      margin-top:18px;
      background: linear-gradient(90deg, var(--purple), var(--purple2));
      color:white;
      border:none;
      border-radius: 14px;
      padding:16px 18px;
      font-weight:800;
      font-size:16px;
      box-shadow: 0 18px 42px rgba(139,53,255,.25);
      cursor:pointer;
    }

    /* Responsive */
    @media (max-width: 900px){
      .canvas{ aspect-ratio:auto; height:auto; }
      .screen{ padding:28px 20px; }
      .grid, .qwrap{ grid-template-columns: 1fr; gap:22px; }
      h1{ font-size:40px; }
      .menu, .answers{ margin-left:0; max-width:100%; }
      .progress{ width:100%; max-width:380px; }
    }
  </style>
</head>

<body>
  <div class="app-frame">
    <main class="canvas">
      <div class="top-controls" aria-hidden="true">
        <div class="icon">☀️</div>
        <div class="switch"></div>
        <div class="icon">🌙</div>
      </div>

      <!-- SCREEN 1: Start Menu -->
      <section class="screen active" id="screen-start" aria-label="Start menu">
        <div class="grid">
          <div>
            <h1>Welcome to the<br><span style="font-weight:900;">Frontend Quiz!</span></h1>
            <p class="sub">Pick a subject to get started.</p>
          </div>

          <div class="menu">
            <div class="menu-card">
              <div class="menu-left">
                <div class="menu-ico">&lt;/&gt;</div>
                <div>HTML</div>
              </div>
            </div>

            <div class="menu-card">
              <div class="menu-left">
                <div class="menu-ico">🎨</div>
                <div>CSS</div>
              </div>
            </div>

            <div class="menu-card">
              <div class="menu-left">
                <div class="menu-ico">JS</div>
                <div>Javascript</div>
              </div>
            </div>

            <div class="menu-card">
              <div class="menu-left">
                <div class="menu-ico">♿</div>
                <div>Accessibility</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- SCREEN 2: Question (Incorrect Answer) -->
      <section class="screen" id="screen-question" aria-label="Question screen">
        <div class="topic">
          <div class="badge">♿</div>
          <div>Accessibility</div>
        </div>

        <div class="qwrap">
          <div>
            <div class="kicker">Question 6 of 10</div>
            <h2 class="qtitle">
              Which of these color<br/>
              contrast ratios defines the<br/>
              minimum WCAG 2.1 Level<br/>
              AA requirement for normal<br/>
              text?
            </h2>

            <div class="progress" aria-label="Progress">
              <div></div>
            </div>
          </div>

          <div>
            <div class="answers" role="list">
              <div class="ans correct" role="listitem">
                <div class="ans-left">
                  <div class="letter">A</div>
                  <div class="value">4.5 : 1</div>
                </div>
                <div class="status">✓</div>
              </div>

              <div class="ans" role="listitem">
                <div class="ans-left">
                  <div class="letter">B</div>
                  <div class="value">3 : 1</div>
                </div>
                <div class="status"></div>
              </div>

              <div class="ans wrong" role="listitem">
                <div class="ans-left">
                  <div class="letter">C</div>
                  <div class="value">2.5 : 1</div>
                </div>
                <div class="status">×</div>
              </div>

              <div class="ans" role="listitem">
                <div class="ans-left">
                  <div class="letter">D</div>
                  <div class="value">5 : 1</div>
                </div>
                <div class="status"></div>
              </div>

              <button class="cta" type="button">Next Question</button>
            </div>
          </div>
        </div>
      </section>

      <!--
        To switch screens:
        - Move the "active" class from #screen-start to #screen-question
        Example:
          document.querySelector('#screen-start').classList.remove('active');
          document.querySelector('#screen-question').classList.add('active');
      -->
    </main>
  </div>
</body>
</html>
