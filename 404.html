<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var repo = "/quiz-app"; // must match your repo name
        var path = window.location.pathname;

        // if you're at /quiz-app/something, keep "/something"
        var rest = path.startsWith(repo) ? path.slice(repo.length) : path;

        // preserve query/hash (hash here would be empty on server 404, but keep it anyway)
        var search = window.location.search || "";
        var hash = window.location.hash || "";

        // redirect to HashRouter route
        window.location.replace(repo + "/#"+ rest + search + hash);
      })();
    </script>
  </head>
  <body></body>
</html>
